<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aqua Guard | Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="login-logo">
                💧
            </div>

            <div class="login-brand">
                <h1>AQUA GUARD</h1>
                <span>SMART WATER MANAGEMENT</span>
            </div>

            <div class="login-heading">
                <h2>Welcome back</h2>
                <p>Sign in to access your household water dashboard.</p>
            </div>

            <form onsubmit="loginUser(event)">

                <label>Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <div class="login-options">

                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#" onclick="forgotPassword(event)">
                        Forgot password?
                    </a>

                </div>

                <button type="submit" class="login-main-btn">
                    Sign In
                    <span>→</span>
                </button>

            </form>

            <div class="login-security">
                🛡️ Secure Aqua Guard Access
            </div>

            <button class="admin-portal-btn" onclick="window.location.href='admin-login.html'">
    🛡️ Admin Portal
</button>

            <p class="demo-note">
                Demo prototype • Aqua Guard
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
